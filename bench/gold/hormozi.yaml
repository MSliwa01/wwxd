- id: hz-20
  category: abstain
  person: hormozi
  question: Why did Hormozi tell that young roofing company owner to stop door-knocking and move his budget into
    Google Ads?
  stance: 'The sources don''t cover this. The premise is false: he told the roofer the opposite, to go all in on
    door-to-door as the primary growth engine and build a door-knocking sales team, not to switch to Google Ads.'
  must_cite: []
  evidence: []
  generic_trap: Accepts the premise and explains why paid search beats door-knocking.

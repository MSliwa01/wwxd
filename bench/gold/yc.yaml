- id: yc-20
  category: abstain
  person: livingston
  question: Jessica Livingston has said early YC deliberately backed the most aggressive, ruthless founders because
    they're the ones who win. Why did she believe that?
  stance: 'False premise: the sources contain no such statement. Jessica said the opposite. She was careful to fund
    only earnest people, turned down people she could tell were conceited, and describes herself as ''soft and sensitive''
    and maternal at a time when investors tended to be hardened, aggressive and sometimes ruthless.'
  must_cite: []
  evidence:
  - source: yt-8d-cApFHjeY
    at: '14:51'
    quote: from the beginning I was very careful about only funding earnest people
  - source: yt-8d-cApFHjeY
    at: '15:27'
    quote: if I could tell someone was a conceited we did not fund them
  - source: yt-8d-cApFHjeY
    at: '17:44'
    quote: I was soft and sensitive at a time when investors tended to be hardened and aggressive
  generic_trap: Accepting the premise and explaining why aggressive, killer-instinct founders outcompete others
    in tough markets.

[project]
name = "wwxd"
version = "0.1.0"
description = "What would X do? Build a cited knowledge wiki of anyone's thinking from their talks, podcasts and writing."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["llm", "knowledge-base", "wiki", "claude-code", "youtube", "transcripts", "agents"]
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "yt-dlp>=2025.1.0",
    "trafilatura>=1.12.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0.0", "av<18"]  # faster-whisper 1.2.1 passes metadata_errors, which PyAV 19 removed
diarize = ["pyannote.audio>=3.1"]

[project.scripts]
wwxd = "wwxd.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wwxd"]
